# Install once:  uv run pre-commit install
# Run manually:  uv run pre-commit run --all-files
#
# Everything runs from the project's own environment (language: system, no downloads), so the
# hooks behave the same on this machine, in CI, and for anyone who clones the repo.
repos:
  - repo: local
    hooks:
      - id: no-secrets
        name: no secrets or data in the commit (blueprint rule 6)
        entry: uv run --no-sync python tools/check_no_secrets.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy --strict (eqrisk and app)
        entry: uv run --no-sync mypy eqrisk app
        language: system
        pass_filenames: false
        files: ^(eqrisk|app)/.*\.py$

      - id: architecture
        name: layer boundaries (data / model / outputs / UI)
        entry: uv run --no-sync pytest tests/test_architecture.py -q
        language: system
        pass_filenames: false
        files: ^(eqrisk|app)/.*\.py$
